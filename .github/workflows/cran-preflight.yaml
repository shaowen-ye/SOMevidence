name: CRAN-preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  CRAN-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_CRAN_INCOMING_REMOTE_: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-tinytex@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Run complete remote CRAN incoming check
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            rm -rf check
            Rscript -e 'options(repos = c(CRAN = "https://cloud.r-project.org")); rcmdcheck::rcmdcheck(args = "--as-cran", error_on = "warning", check_dir = "check")'
            Rscript .github/scripts/verify-check-log.R check --require-remote-incoming --require-pdf-manual && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "CRAN preflight attempt $attempt did not pass; retrying."
              sleep 20
            fi
          done
          exit 1
      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cran-preflight
          path: check
          if-no-files-found: error

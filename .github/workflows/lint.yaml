name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::yaml
          needs: lint
      - name: Validate citation metadata
        run: |
          metadata <- as.list(read.dcf("DESCRIPTION")[1L, ])
          cff <- yaml::read_yaml("CITATION.cff")
          released <- as.Date(as.character(cff[["date-released"]]))
          shanghai_today <- as.Date(Sys.time(), tz = "Asia/Shanghai")
          stopifnot(
            identical(as.character(cff$version), metadata$Version),
            length(cff$authors) == 1L,
            identical(cff$authors[[1L]][["given-names"]], "Shaowen"),
            identical(cff$authors[[1L]][["family-names"]], "Ye"),
            !is.na(released),
            released <= shanghai_today
          )
        shell: Rscript {0}
      - name: Lint package
        run: |
          lints <- lintr::lint_package()
          print(lints)
          if (length(lints)) {
            stop(sprintf("Found %d lint finding(s).", length(lints)))
          }
        shell: Rscript {0}

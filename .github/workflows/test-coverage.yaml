name: test-coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage
      - name: Measure and enforce test coverage
        run: |
          coverage <- covr::package_coverage(type = "tests")
          print(coverage)
          percent <- covr::percent_coverage(coverage)
          writeLines(
            sprintf("Package test coverage: %.2f%%", percent),
            "coverage-summary.txt"
          )
          covr::to_cobertura(coverage, filename = "cobertura.xml")
          if (percent < 80) {
            stop(sprintf("Test coverage %.2f%% is below the 80%% threshold.", percent))
          }
        shell: Rscript {0}
      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage-summary.txt ]; then
            cat coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-coverage
          path: |
            coverage-summary.txt
            cobertura.xml
          if-no-files-found: ignore
